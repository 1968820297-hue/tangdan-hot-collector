<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>汤淡采集｜热点宝达人提取</title>
    <link rel="icon" type="image/png" href="icons/icon-32.png">
    <style>
      body {
        width: 300px;
        margin: 0;
        padding: 12px;
        color: #111827;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 12px;
      }
      .brand img {
        display: block;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 8px;
      }
      .brand h1 { margin: 0; }
      .monitor-card {
        margin-bottom: 10px;
        padding: 9px;
        border: 1px solid #bfdbfe;
        border-radius: 7px;
        background: #eff6ff;
      }
      .monitor-card strong {
        display: block;
        margin-bottom: 4px;
        color: #1d4ed8;
      }
      #monitor-status {
        color: #374151;
        word-break: break-word;
      }
      #monitor-status.error {
        color: #b91c1c;
      }
      .collector-label {
        display: block;
        margin: 8px 0 4px;
        color: #374151;
        font-weight: 700;
      }
      .collector-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .collector-row input {
        min-width: 0;
        min-height: 32px;
        flex: 1;
        box-sizing: border-box;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 6px 8px;
        font: inherit;
      }
      .collector-row button {
        width: auto;
        min-width: 52px;
        min-height: 32px;
        margin-top: 0;
      }
      #collector-note {
        margin-top: 4px;
        color: #6b7280;
        font-size: 11px;
        word-break: break-word;
      }
      #collector-note.error {
        color: #b91c1c;
      }
      #transcription-note {
        margin-top: 4px;
        color: #6b7280;
        font-size: 12px;
      }
      #transcription-note.error {
        color: #b91c1c;
      }
      #manual-transcribe-note {
        margin: 2px 0 7px 22px;
        color: #6b7280;
        font-size: 11px;
      }
      #monitor-toggle.enabled {
        background: #fff;
        border-color: #fca5a5;
        color: #b91c1c;
        font-weight: 700;
      }
      #monitor-toggle.disabled {
        background: #16a34a;
        color: #fff;
        font-weight: 700;
      }
      button {
        display: block;
        width: 100%;
        min-height: 34px;
        margin-top: 8px;
        border: 1px solid transparent;
        border-radius: 6px;
        cursor: pointer;
        font: inherit;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
      :focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
      .primary {
        background: #246bfe;
        color: #fff;
      }
      .dark {
        background: #111827;
        color: #fff;
      }
      .secondary {
        background: #fff;
        border-color: #d1d5db;
        color: #111827;
      }
      .option-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0 2px;
        color: #374151;
        user-select: none;
      }
      .option-row input {
        width: 14px;
        height: 14px;
        margin: 0;
      }
      #status {
        margin-top: 10px;
        min-height: 18px;
        color: #4b5563;
        word-break: break-word;
      }
      #status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <header class="brand">
      <img src="icons/icon-128.png" width="32" height="32" alt="汤淡品牌图标">
      <h1>汤淡采集</h1>
    </header>
    <div class="monitor-card">
      <strong>私聊自动监控</strong>
      <label class="collector-label" for="collector-name">收集人</label>
      <div class="collector-row">
        <input id="collector-name" type="text" autocomplete="off" placeholder="汤淡">
        <button id="save-collector" class="secondary" type="button">保存</button>
      </div>
      <div id="collector-note" role="status" aria-live="polite">正在读取收集人…</div>
      <div id="monitor-status" role="status" aria-live="polite">正在读取状态…</div>
      <button id="monitor-toggle" class="disabled" type="button" disabled>正在读取监控开关…</button>
      <button id="open-monitor" class="secondary" type="button">打开专用监控页</button>
      <label class="option-row">
        <input id="auto-transcribe" type="checkbox" disabled>
        私聊入库后自动转逐字稿
      </label>
      <div id="transcription-note" role="status" aria-live="polite">正在读取逐字稿设置…</div>
    </div>
    <label class="option-row">
      <input id="include-comments" type="checkbox">
      抓取前3条热评
    </label>
    <label class="option-row">
      <input id="manual-transcribe" type="checkbox">
      本次作品同步后转逐字稿
    </label>
    <div id="manual-transcribe-note">主页批量同步时，会为本次选中的每条视频转写并产生费用。</div>
    <button id="sync" class="primary" type="button">提取并同步飞书</button>
    <button id="export" class="dark" type="button">只导出 JSON</button>
    <button id="single-work" class="primary" type="button">同步当前作品</button>
    <button id="works" class="primary" type="button">同步主页作品到飞书</button>
    <button id="works-filter" class="secondary" type="button">筛选作品同步</button>
    <button id="options" class="secondary" type="button">飞书与逐字稿设置</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
